<!DOCTYPE html>
<html lang="ne-NP, en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>नयाँ पासवर्ड सेट गर्नुहोस् — MIYAD (म्याद)</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
  :root {
    --nagarik-blue: #0C44AC;
    --nagarik-navy: #002B7F;
    --nagarik-crimson: #DC143C;
    --nagarik-bg: #F4F7FC;
    --nagarik-text: #1E293B;
    --nagarik-muted: #64748B;
    --nagarik-border: #E2E8F0;
    --nagarik-gold: #D97706;
    --nagarik-green: #059669;
    --nagarik-green-bg: #D1FAE5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--nagarik-bg);
    color: var(--nagarik-text);
    font-family: 'Plus Jakarta Sans', 'Mukta', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    border: 1px solid var(--nagarik-border);
    box-shadow: 0 8px 24px rgba(12,68,172,0.1);
    max-width: 420px;
    width: 100%;
    padding: 28px 24px;
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px; color: var(--nagarik-navy); margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--nagarik-muted); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; }
  .field input {
    width: 100%;
    background: var(--nagarik-bg);
    border: 1.5px solid var(--nagarik-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus { border-color: var(--nagarik-blue); background:#fff; outline:none; }
  .pw-strength-track { height:6px; width:100%; background:var(--nagarik-border); border-radius:4px; overflow:hidden; margin-top:8px; }
  .pw-strength-fill { height:100%; width:0%; background:var(--nagarik-crimson); transition:width .2s, background .2s; }
  .pw-strength-label { font-size:11.5px; font-weight:700; margin-top:5px; color: var(--nagarik-muted); }
  .pw-rules { list-style:none; margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .pw-rules li { font-size:11px; color:var(--nagarik-muted); display:flex; align-items:center; gap:5px; }
  .pw-rules li.ok { color: var(--nagarik-green); font-weight:700; }
  .pw-rules li .dot { width:6px; height:6px; border-radius:50%; background:var(--nagarik-border); flex-shrink:0; }
  .pw-rules li.ok .dot { background: var(--nagarik-green); }
  .btn { width:100%; background: var(--nagarik-blue); color:#fff; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; margin-top:6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .notice { border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px; display:none; }
  .notice.show { display:block; }
  .notice.error { background:#FEE2E2; color:#B91C1C; border:1px solid #FCA5A5; }
  .notice.success { background: var(--nagarik-green-bg); color:#065F46; border:1px solid #A7F3D0; }
  .back-link { display:block; text-align:center; margin-top:16px; font-size:13px; color: var(--nagarik-blue); font-weight:700; text-decoration:none; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">🇳🇵 MIYAD (म्याद)</div>
  <div class="subtitle">नयाँ पासवर्ड सेट गर्नुहोस् (Set a new password)</div>

  <div class="notice" id="notice"></div>

  <div id="formWrap">
    <div class="field">
      <label for="pw1">नयाँ पासवर्ड (New Password)</label>
      <input type="password" id="pw1" placeholder="••••••••" autocomplete="new-password" />
      <div class="pw-strength-track"><div class="pw-strength-fill" id="pwStrengthFill"></div></div>
      <div class="pw-strength-label" id="pwStrengthLabel">Password strength</div>
      <ul class="pw-rules" id="pwRules">
        <li data-rule="len"><span class="dot"></span> कम्तिमा ८ अक्षर (8+ chars)</li>
        <li data-rule="upper"><span class="dot"></span> ठूलो अक्षर (Uppercase)</li>
        <li data-rule="lower"><span class="dot"></span> सानो अक्षर (Lowercase)</li>
        <li data-rule="num"><span class="dot"></span> अंक (Number)</li>
        <li data-rule="special"><span class="dot"></span> विशेष चिन्ह (Symbol !@#$…)</li>
      </ul>
    </div>
    <div class="field">
      <label for="pw2">पासवर्ड फेरि लेख्नुहोस् (Confirm Password)</label>
      <input type="password" id="pw2" placeholder="••••••••" autocomplete="new-password" />
    </div>
    <button class="btn" id="submitBtn">पासवर्ड परिवर्तन गर्नुहोस् (Update Password)</button>
  </div>

  <a href="/" class="back-link">&larr; MIYAD मा फर्कनुहोस् (Back to app)</a>
</div>

<script>
(function() {
  var cfg = window.RENEWAL_CONFIG || {};
  var noticeEl = document.getElementById('notice');
  var formWrap = document.getElementById('formWrap');
  var submitBtn = document.getElementById('submitBtn');
  var supabaseClient = null;
  var sessionReady = false;

  function showNotice(msg, type) {
    noticeEl.textContent = msg;
    noticeEl.className = 'notice show ' + type;
  }

  function checkPasswordRules(pw) {
    pw = pw || '';
    return {
      len: pw.length >= 8,
      upper: /[A-Z]/.test(pw),
      lower: /[a-z]/.test(pw),
      num: /[0-9]/.test(pw),
      special: /[^A-Za-z0-9]/.test(pw)
    };
  }
  function isStrongPassword(pw) {
    var r = checkPasswordRules(pw);
    return r.len && r.upper && r.lower && r.num && r.special;
  }
  function updateStrengthUI(pw) {
    var rules = checkPasswordRules(pw);
    var passCount = 0;
    Object.keys(rules).forEach(function(key) {
      var li = document.querySelector('#pwRules li[data-rule="' + key + '"]');
      if (!li) return;
      li.classList.toggle('ok', rules[key]);
      if (rules[key]) passCount++;
    });
    var fill = document.getElementById('pwStrengthFill');
    var label = document.getElementById('pwStrengthLabel');
    fill.style.width = (passCount / 5 * 100) + '%';
    if (passCount <= 2) { fill.style.background = '#DC143C'; label.textContent = 'Weak (कमजोर)'; }
    else if (passCount <= 4) { fill.style.background = '#D97706'; label.textContent = 'Medium (ठिकै)'; }
    else { fill.style.background = '#059669'; label.textContent = 'Strong (बलियो)'; }
  }
  document.getElementById('pw1').addEventListener('input', function(e) { updateStrengthUI(e.target.value); });

  submitBtn.addEventListener('click', async function() {
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;

    if (!sessionReady) {
      showNotice('रिसेट लिंक अमान्य वा म्याद सकिएको छ। फेरि रिसेट लिंक माग्नुहोस्। (This reset link is invalid or expired — request a new one.)', 'error');
      return;
    }
    if (!isStrongPassword(pw1)) {
      showNotice('पासवर्ड कमजोर छ — माथिका सबै सर्त पूरा गर्नुहोस्। (Password is too weak — meet all the rules above.)', 'error');
      return;
    }
    if (pw1 !== pw2) {
      showNotice('दुई पासवर्ड मिलेन। (Passwords do not match.)', 'error');
      return;
    }

    submitBtn.disabled = true;
    try {
      var res = await supabaseClient.auth.updateUser({ password: pw1 });
      if (res.error) throw res.error;
      formWrap.style.display = 'none';
      showNotice('पासवर्ड सफलतापूर्वक परिवर्तन भयो! अब साइन-इन गर्नुहोस्। (Password updated — you can sign in now.)', 'success');
    } catch(err) {
      showNotice('त्रुटि (Error): ' + err.message, 'error');
      submitBtn.disabled = false;
    }
  });

  function init() {
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase) {
      showNotice('Configuration error — कन्फिग लोड भएन।', 'error');
      return;
    }
    supabaseClient = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    // Supabase-js parses the recovery token out of the URL fragment automatically and
    // fires this event once a recovery session has been established.
    supabaseClient.auth.onAuthStateChange(function(event, session) {
      if (event === 'PASSWORD_RECOVERY' && session) {
        sessionReady = true;
      }
    });

    // Fallback in case the event already fired before this listener attached.
    setTimeout(async function() {
      if (sessionReady) return;
      var s = await supabaseClient.auth.getSession();
      if (s.data && s.data.session) {
        sessionReady = true;
      } else {
        showNotice('रिसेट लिंक फेला परेन वा म्याद सकिएको छ। इमेलको लिंकबाट फेरि खोल्नुहोस्। (No active reset session found — open this page from the link in your email.)', 'error');
      }
    }, 1200);
  }

  init();
})();
</script>
</body>
</html>
